<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><meta name="description" content="Among8 — дуэль интуиции. Два игрока, 10 вопросов о мире и 15 секунд на ответ."><title>Among8 — дуэль интуиции</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%236451c7'/%3E%3Ctext x='32' y='48' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='48' fill='white'%3E8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/manrope.css"><link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script></head>
<body><a class="skip" href="#main">К игре</a><div class="shell"><header><a class="brand" href="./" aria-label="Among8, на главную">Among<span>8</span></a><button id="sound-toggle" class="icon-button" aria-label="Выключить звук" aria-pressed="true">♪</button></header>
<main id="main" tabindex="-1"><section id="setup" class="setup"><div class="intro-duo" aria-hidden="true"><span id="hero-placeholder" class="hero-placeholder" hidden>?</span><canvas data-character="plum"></canvas><span>vs</span><canvas data-character="peach"></canvas></div><h1>Чья интуиция<br>ближе к правде?</h1><p class="lead">10 вопросов · 15 секунд на ответ</p>
<form id="setup-form"><div class="mode-switch" role="group" aria-label="Режим игры"><button type="button" data-mode="solo" aria-pressed="false">Играть одному</button><button type="button" data-mode="duel" aria-pressed="true">С другом</button></div><div class="question-set-switch" role="group" aria-label="Набор вопросов"><button type="button" data-question-set="1" aria-pressed="true">Набор 1</button><button type="button" data-question-set="2" aria-pressed="false">Набор 2</button></div><fieldset><legend id="selected-character">Ты — Зубик</legend><div id="avatar-options" class="avatar-options"></div><p id="character-status" class="character-status" role="status"></p></fieldset><details id="join-details"><summary>Есть код приглашения?</summary><label id="room-label" for="room-code">Код комнаты <span>если тебя пригласили</span></label><input id="room-code" name="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Например, ABCD2345"></details><button id="create-button" class="button primary" type="submit">Создать дуэль <span aria-hidden="true">→</span></button><button id="join-button" class="button secondary" type="button">Войти по коду</button><button id="practice-again" class="text-button" type="button">Пробный вопрос</button></form></section>
<section id="room-view" hidden></section><p id="error" class="error" role="alert" hidden></p><p id="connection" class="connection" role="status" hidden></p></main><footer><button id="info-open" class="info-link">Инфо</button></footer></div><dialog id="info-dialog" aria-label="Информация об игре"><button id="info-close" class="icon-button" aria-label="Закрыть">×</button><div id="info-content"></div></dialog><div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div><noscript>Для игры включи JavaScript в браузере.</noscript></body></html>
