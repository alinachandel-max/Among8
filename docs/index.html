<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><meta name="description" content="Among8 — дуэль интуиции. Два игрока, 10 вопросов о мире и 15 секунд на ответ."><title>Among8 — дуэль интуиции</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%236451c7'/%3E%3Ctext x='32' y='48' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='48' fill='white'%3E8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/manrope.css"><link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script></head>
<body><a class="skip" href="#main">К игре</a><div class="shell"><header><a class="brand" href="./" aria-label="Among8, на главную">Among<span>8</span></a><span class="edition">ИГРА НА ИНТУИЦИЮ</span><button id="sound-toggle" class="icon-button" aria-label="Выключить звук" aria-pressed="true">♪</button></header>
<main id="main" tabindex="-1"><section id="setup" class="setup"><div class="intro-duo" aria-hidden="true"><canvas data-character="plum"></canvas><span>vs</span><canvas data-character="peach"></canvas></div><p class="eyebrow">ВЫ ДВОЕ. И РЕАЛЬНОСТЬ.</p><h1>Чья интуиция<br>ближе к правде?</h1><p class="lead">10 вопросов · 15 секунд на ответ</p>
<form id="setup-form"><div class="mode-switch" role="group" aria-label="Режим игры"><button type="button" data-mode="solo" aria-pressed="false">Играть одному</button><button type="button" data-mode="duel" aria-pressed="true">С другом</button></div><div class="question-set-switch" role="group" aria-label="Выбери раунд"><button type="button" data-question-set="1" aria-pressed="true">Раунд 1</button><button type="button" data-question-set="2" aria-pressed="false">Раунд 2 <span>Новый</span></button></div><fieldset><legend>Выбери персонажа</legend><div id="avatar-options" class="avatar-options"></div><p id="character-status" class="character-status" role="status"></p></fieldset><label id="room-label" for="room-code">Код комнаты <span>если тебя пригласили</span></label><input id="room-code" name="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Например, ABCD2345"><button id="create-button" class="button primary" type="submit">Создать дуэль <span aria-hidden="true">→</span></button><button id="join-button" class="button secondary" type="button">Войти по коду</button><p class="small">Без регистрации. Твоё имя — твой персонаж.</p></form></section>
<section id="room-view" hidden></section><p id="error" class="error" role="alert" hidden></p><p id="connection" class="connection" role="status" hidden></p></main><footer>Один значок — один процент.</footer></div><div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div><noscript>Для игры включи JavaScript в браузере.</noscript></body></html>
